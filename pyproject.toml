[project]
name = "ask-claude-workflow"
version = "0.1.0"
description = "Mistral workflow that forwards questions to the Anthropic Claude API"
requires-python = ">=3.12"
dependencies = [
    "mistralai[workflows]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["workflows"]
package-dir = {"" = "src"}
